name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Go and the web UI are compiled once here, with caches that survive between
  # runs, and the three image builds only copy the results in (GO_SOURCE=prebuilt).
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      GO_IMAGE: docker.io/library/golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
      FRIDA_VERSION: 17.15.5
      FRIDA_DEVKIT_SHA256: 4f7b5ebfef5297f3dfc2ebc7629aa0a1d19334988ce95f74dbfd29b8665235e6
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: go bun
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build-frida
            ~/.cache/go-mod-frida
          key: go-frida-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-frida-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-frida-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'frida/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Frida builds (the session and phones images), in the image's own glibc
        run: |
          set -euxo pipefail
          mkdir -p prebuilt /tmp/frida "$HOME/.cache/go-build-frida" "$HOME/.cache/go-mod-frida"
          curl -fsSL "https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-core-devkit-$FRIDA_VERSION-linux-x86_64.tar.xz" -o /tmp/devkit.tar.xz
          echo "$FRIDA_DEVKIT_SHA256  /tmp/devkit.tar.xz" | sha256sum -c -
          tar -xJf /tmp/devkit.tar.xz -C /tmp/frida
          docker run --rm -v "$PWD":/src -w /src \
            -v "$HOME/.cache/go-build-frida":/root/.cache/go-build -v "$HOME/.cache/go-mod-frida":/go/pkg/mod \
            -v /tmp/frida:/opt/frida:ro \
            -e CGO_ENABLED=1 -e CGO_CFLAGS=-I/opt/frida -e CGO_LDFLAGS=-L/opt/frida -e VERSION \
            "$GO_IMAGE" \
            go build -buildvcs=false -tags frida -trimpath -ldflags "-s -w -X main.version=$VERSION" -o prebuilt/holtdroid-frida-linux-amd64 ./cmd/holtdroid
          stage="$(mktemp -d)"
          cp frida/package.json frida/bun.lock "$stage"/
          (cd "$stage" && bun install --frozen-lockfile --production)
          cp frida/*.ts "$stage"/
          prebuilt/holtdroid-frida-linux-amd64 agent compile-scripts "$stage"
          cp "$stage/agent.js" "$stage/system.js" prebuilt/
      - name: Web UI
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run --cwd web build
      - name: holtdroid and the connect clients
        run: |
          set -euxo pipefail
          mkdir -p prebuilt/connect
          export CGO_ENABLED=0
          archs=amd64
          if [ "$GITHUB_REF_TYPE" = tag ]; then archs="amd64 arm64"; fi
          for arch in $archs; do
            GOOS=linux GOARCH=$arch go build -buildvcs=false -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "prebuilt/holtdroid-linux-$arch" ./cmd/holtdroid
          done
          for p in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} go build -buildvcs=false -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "prebuilt/connect/holtdroid-${p%/*}-${p#*/}" ./cmd/holtdroid-connect
          done
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: prebuilt
          retention-days: 1

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: prebuilt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Dockerfile
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            GO_SOURCE=prebuilt

  session-image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: (sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &)
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: prebuilt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-session
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/session.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            GO_SOURCE=prebuilt
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-session:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-session:buildcache,mode=max

  physical-image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: prebuilt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-physical
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/physical.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            GO_SOURCE=prebuilt
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-physical:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-physical:buildcache,mode=max

  chart:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/holtdroid --version "$version" --app-version "$version"
          helm push "holtdroid-$version.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts

  # Deployments that should only roll out commits whose image exists track
  # the deploy branch instead of main; it only ever moves forward.
  deploy-branch:
    if: github.ref == 'refs/heads/main'
    needs: [image, session-image, physical-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: deploy-branch
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          if git fetch origin deploy && ! git merge-base --is-ancestor FETCH_HEAD "$GITHUB_SHA"; then
            echo "deploy is already past $GITHUB_SHA"
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/deploy"
