image:
  repository: ghcr.io/kriakiku/holtdroid
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# External URL of the portal, e.g. https://android.example.com.
publicURL: ""

# Name of an existing Secret exposed as environment variables to every
# component, so config can reference values as env:NAME.
existingSecret: ""

# Merged into the api's config file. Everything from the configuration docs
# can go here except listen addresses and providers, which the chart fills
# in. Without `sources` the api serves one filesystem source "local" from
# /var/lib/holtdroid/apks (api.persistence); add S3 sources here, e.g.
#   sources:
#     - name: slack
#       type: s3
#       readOnly: true
#       s3: { endpoint: https://s3.example.com, bucket: apks, prefix: slack, accessKey: env:S3_KEY, secretKey: env:S3_SECRET }
config:
  auth:
    mode: anonymous
  uploads:
    enabled: true
    maxSize: 1GiB
    temporaryTTL: 168h
  sessions:
    idleTimeout: 30m
    maxTTL: 8h
  storage:
    type: filesystem
    filesystem:
      dir: /var/cache/holtdroid
  cache:
    maxSize: 20GiB
  # Save app data when sessions stop (docs: Concepts → App data). Give it a
  # storage of its own: the default shared storage is the cache volume.
  appData:
    enabled: false
  database:
    type: memory
  # ADB tools on the session page (logcat, files, terminal). On emulators
  # that is a root shell for everyone who may open the session.
  adb:
    browser: true
    ownerOnly: true

api:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 512Mi }
  # Volume for storage.type=filesystem. The cache is rebuilt from sources,
  # so an emptyDir keeps the api stateless.
  cacheVolume:
    emptyDir:
      sizeLimit: 25Gi
  # Mounted at /var/lib/holtdroid: the default "local" source and its
  # uploads. A ReadWriteOnce claim pins the api to one replica (the chart
  # stops the old pod before starting a new one); use S3 sources to scale out.
  # Disabled: an emptyDir, so uploads are lost on restart.
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 10Gi
  env: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

providers:
  # Simulated devices for trying the UI without KVM.
  fake:
    enabled: false
    name: fake
    slots: 4
    stepDelay: 3s
    resources:
      requests: { cpu: 5m, memory: 16Mi }
      limits: { memory: 128Mi }

  # Android emulators as Pods on KVM nodes (one session per node). The
  # provider lists Nodes cluster-wide, so the chart adds a ClusterRole.
  emulator:
    enabled: false
    name: emulator
    # Maximum concurrent sessions; 0 means one per matching node.
    slots: 4
    # Nodes that may run sessions; they need /dev/kvm.
    nodeSelector: {}
    tolerations: []
    session:
      image:
        repository: ghcr.io/kriakiku/holtdroid-session
        # Defaults to image.tag (CI builds both images for every commit).
        tag: ""
        pullPolicy: IfNotPresent
      resources:
        requests: { cpu: "3", memory: 5Gi }
        # No CPU limit: CFS throttling makes the software GPU drop frames.
        limits: { memory: 7Gi }
      # host: render on the node's GPU (/dev/dri) through VirtualGL, falling
      # back to software when the node has none. software: SwiftShader.
      gpu: host
    # Per-node overrides by node name: guest cores, guest RAM in MiB (the
    # image defaults to 4 and 4096) and container resources, e.g.
    # core: { cores: 8, ram: 8192, resources: { requests: { cpu: "3", memory: 10Gi }, limits: { memory: 12Gi } } }
    nodes: {}
    # Per-session VPN sidecar, see the emulator provider docs. Empty: no VPN.
    vpn: {}
    # Only the api (and the ssh-gateway, on the tunnel port) may reach
    # session agents.
    networkPolicy:
      enabled: true
    # Pulls the session image onto every session node ahead of the first
    # launch (it is several GB).
    prepull:
      enabled: true
      # With a moving tag (e.g. main) and pullPolicy Always, the provider
      # checks the tag's digest in the registry (anonymously) and restarts
      # the DaemonSet when it moves, so nodes pull the new image right away.
      refresh:
        enabled: true
        interval: 5m
      pauseImage: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
      resources:
        requests: { cpu: 1m, memory: 4Mi }
        limits: { memory: 16Mi }
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 128Mi }

# SSH access for the holtdroid client: users run the command from the portal's
# Computers page once per computer; the client publishes their local ports on
# all of their devices and forwards each device's ADB. Only tunnels, never a
# shell. The api signs each computer's key into a short-lived certificate.
sshGateway:
  enabled: false
  replicas: 1
  # PEM private keys, as secret references such as env:SSH_HOST_KEY (from
  # existingSecret) or file:/run/secrets/... Without a hostKey every gateway
  # restart, and without a caKey every api restart, makes enrolled computers
  # enroll again.
  hostKey: ""
  caKey: ""
  # Where clients connect; defaults to publicURL's host and the service port.
  publicHost: ""
  publicPort: 0
  allowADB: true
  allowReverse: true
  # Device ports that may be published. The port is bound on the device's
  # loopback only, so privileged ports are fine on emulators.
  reversePorts: "1-65535"
  maxTunnelsPerConnection: 32
  # Lifetime of the one-time code in the portal's command, of a computer's
  # certificate (renewed in the background) and of its refresh token (renewed
  # with every certificate, so it only runs out for unused computers).
  # The connect command and client accept the portal's TLS certificate
  # without checking it. Only for a portal with a self-signed certificate,
  # e.g. in development: it hides a man-in-the-middle on the portal's HTTPS.
  insecureTLS: false
  codeTTL: 10m
  certificateTTL: 15m
  refreshTTL: 720h
  # Expose port 2222 with a LoadBalancer/NodePort here, or keep ClusterIP and
  # route an ingress TCP entrypoint to it (Traefik IngressRouteTCP).
  service:
    type: ClusterIP
    port: 2222
    nodePort: null
    annotations: {}
  env: []
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Additional out-of-tree providers: [{name, url}]
extraProviders: []

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Prometheus metrics and OpenTelemetry tracing for every component and,
# with the emulator provider, for session agents. See the "Monitoring and
# audit" docs page.
telemetry:
  metrics:
    enabled: false
    # Every pod serves /metrics on this port, named "metrics".
    port: 9090
    # PodMonitor (Prometheus Operator) for the components and session pods.
    podMonitor:
      enabled: false
      interval: 30s
      labels: {}
    # Who may scrape session pods past the sessions NetworkPolicy.
    from:
      - namespaceSelector: {}
  tracing:
    enabled: false
    # OTLP/HTTP endpoint, e.g. http://otel-collector.monitoring:4318. Empty:
    # the standard OTEL_EXPORTER_OTLP_* variables (api.env and friends).
    endpoint: ""
    insecure: false
    sampleRatio: 1

# Audit log of the api and the ssh-gateway: JSON lines with "log":"audit" on
# stdout, optionally also as OTLP logs, to a webhook and into a bounded store
# the api shows to admins.
audit:
  stdout: true
  otlp:
    enabled: false
    endpoint: ""
    insecure: false
  webhook:
    # Secret reference to the URL, e.g. env:AUDIT_WEBHOOK_URL. Empty: off.
    url: ""
    # Secret reference to an Authorization header value.
    authorization: ""
    batchSize: 100
    flushInterval: 5s
    retries: 5
    timeout: 10s
  # Recent events the api keeps for the admin "Audit log" page; the
  # ssh-gateway forwards its events there. Meant for small installs: each api
  # replica keeps its own copy. Long-term storage is the job of the sinks above.
  store:
    enabled: true
    # Oldest events are dropped beyond either limit. 10000 events take
    # about 5 MiB of memory; maxAge 0 means no age limit.
    maxEvents: 10000
    maxAge: 720h
    # Where events survive a restart, as a JSON lines file of at most about
    # twice maxEvents lines:
    #   data   — on the api data volume (api.persistence), survives everything
    #   volume — on audit.store.volume below, e.g. tmpfs: survives container
    #            restarts but not a new pod; its size counts against the
    #            api memory limit
    #   none   — process memory only, empty after every restart
    persistence: data
    volume:
      emptyDir:
        medium: Memory
        sizeLimit: 32Mi

# Extra manifests rendered with tpl, e.g. an ExternalSecret or a Middleware.
extraObjects: []
