image:
  repository: ghcr.io/kriakiku/holtdroid
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# External URL of the portal, e.g. https://android.example.com.
publicURL: ""

# Name of an existing Secret exposed as environment variables to every
# component, so config can reference values as env:NAME.
existingSecret: ""

# Merged into the api's config file. Everything from the configuration docs
# can go here except listen addresses and providers, which the chart fills
# in. Without `sources` the api serves one filesystem source "local" from
# /var/lib/holtdroid/apks (api.persistence); add S3 sources here, e.g.
#   sources:
#     - name: slack
#       type: s3
#       readOnly: true
#       s3: { endpoint: https://s3.example.com, bucket: apks, prefix: slack, accessKey: env:S3_KEY, secretKey: env:S3_SECRET }
config:
  auth:
    mode: anonymous
  uploads:
    enabled: true
    maxSize: 1GiB
  sessions:
    idleTimeout: 30m
    maxTTL: 8h
  storage:
    type: filesystem
    filesystem:
      dir: /var/cache/holtdroid
  cache:
    maxSize: 20GiB
  database:
    type: memory

api:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 512Mi }
  # Volume for storage.type=filesystem. The cache is rebuilt from sources,
  # so an emptyDir keeps the api stateless.
  cacheVolume:
    emptyDir:
      sizeLimit: 25Gi
  # Mounted at /var/lib/holtdroid: the default "local" source and its
  # uploads. A ReadWriteOnce claim pins the api to one replica (the chart
  # switches to the Recreate strategy); use S3 sources to scale out.
  # Disabled: an emptyDir, so uploads are lost on restart.
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 10Gi
  env: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

providers:
  # Simulated devices for trying the UI without KVM.
  fake:
    enabled: false
    name: fake
    slots: 4
    stepDelay: 3s
    resources:
      requests: { cpu: 5m, memory: 16Mi }
      limits: { memory: 128Mi }

# Additional out-of-tree providers: [{name, url}]
extraProviders: []

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Extra manifests rendered with tpl, e.g. an ExternalSecret or a Middleware.
extraObjects: []
