{{- if .Values.sources.dir.enabled }}
{{- $name := include "holtdroid.fullname" . -}}
{{- $p := .Values.sources.dir.persistence -}}
{{- if not $p.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-source-dir
  labels:
    {{- include "holtdroid.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $p.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-source-dir
  labels:
    {{- include "holtdroid.labels" . | nindent 4 }}
    app.kubernetes.io/component: source-dir
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "holtdroid.selector" (dict "root" . "component" "source-dir") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "holtdroid.selector" (dict "root" . "component" "source-dir") | nindent 8 }}
    spec:
      {{- include "holtdroid.pod" (dict "root" .) | nindent 6 }}
      containers:
        - name: source-dir
          {{- include "holtdroid.container" (dict "root" .) | nindent 10 }}
          args: [source-dir]
          env:
            - { name: HOLTDROID_PATH, value: /data }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /v1/health, port: http }
          resources:
            {{- toYaml .Values.sources.dir.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $p.existingClaim | default (printf "%s-source-dir" $name) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-source-dir
  labels:
    {{- include "holtdroid.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "holtdroid.selector" (dict "root" . "component" "source-dir") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
