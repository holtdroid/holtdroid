{{- $name := include "holtdroid.fullname" . -}}
{{- $cfg := deepCopy .Values.config -}}
{{- $_ := set $cfg "listen" ":8080" -}}
{{- $_ := set $cfg "internalListen" ":8081" -}}
{{- $_ := set $cfg "publicURL" .Values.publicURL -}}
{{- $_ := set $cfg "internalURL" (printf "http://%s-api-internal:8081" $name) -}}
{{- $_ := set $cfg "telemetry" (include "holtdroid.telemetry" . | fromYaml) -}}
{{- $_ := set $cfg "audit" (include "holtdroid.audit" (dict "root" . "component" "api") | fromYaml) -}}
{{- $auditVolume := and .Values.audit.store.enabled (eq .Values.audit.store.persistence "volume") -}}
{{- $providers := list -}}
{{- if .Values.providers.fake.enabled -}}
{{- $providers = append $providers (dict "name" .Values.providers.fake.name "url" (printf "http://%s-provider-fake:8080" $name)) -}}
{{- end -}}
{{- if .Values.providers.emulator.enabled -}}
{{- $providers = append $providers (dict "name" .Values.providers.emulator.name "url" (printf "http://%s-provider-emulator:8080" $name)) -}}
{{- end -}}
{{- $providers = concat $providers .Values.extraProviders -}}
{{- $_ := set $cfg "providers" $providers -}}
{{- $g := .Values.sshGateway -}}
{{- if $g.enabled -}}
{{- $_ := set $cfg "ssh" (dict
  "enabled" true
  "gatewayURL" (printf "http://%s-ssh-gateway-headless:8080" $name)
  "publicHost" $g.publicHost
  "publicPort" (int ($g.publicPort | default $g.service.port))
  "allowADB" $g.allowADB
  "allowReverse" $g.allowReverse
  "maxTunnelsPerConnection" $g.maxTunnelsPerConnection
  "caKey" $g.caKey
  "codeTTL" $g.codeTTL
  "certificateTTL" $g.certificateTTL
  "refreshTTL" $g.refreshTTL) -}}
{{- end -}}
{{- $p := .Values.api.persistence -}}
{{- if and $p.enabled (not $p.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "holtdroid.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml $p.accessModes | nindent 4 }}
  {{- with $p.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-api
  labels:
    {{- include "holtdroid.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  labels:
    {{- include "holtdroid.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  {{- if and $p.enabled (has "ReadWriteOnce" $p.accessModes) }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  {{- end }}
  selector:
    matchLabels:
      {{- include "holtdroid.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "holtdroid.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml $cfg | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "holtdroid.pod" (dict "root" .) | nindent 6 }}
      containers:
        - name: api
          {{- include "holtdroid.container" (dict "root" .) | nindent 10 }}
          args: [api, --config, /etc/holtdroid/config.yaml]
          {{- with .Values.api.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: internal, containerPort: 8081 }
            {{- if .Values.telemetry.metrics.enabled }}
            - { name: metrics, containerPort: {{ .Values.telemetry.metrics.port }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/holtdroid, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if eq (.Values.config.storage.type | default "filesystem") "filesystem" }}
            - { name: cache, mountPath: {{ .Values.config.storage.filesystem.dir | default "/var/cache/holtdroid" }} }
            {{- end }}
            - { name: data, mountPath: /var/lib/holtdroid }
            {{- if $auditVolume }}
            - { name: audit, mountPath: /var/lib/holtdroid-audit }
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-api
        - name: tmp
          emptyDir: {}
        {{- if eq (.Values.config.storage.type | default "filesystem") "filesystem" }}
        - name: cache
          {{- toYaml .Values.api.cacheVolume | nindent 10 }}
        {{- end }}
        - name: data
          {{- if $p.enabled }}
          persistentVolumeClaim:
            claimName: {{ $p.existingClaim | default (printf "%s-data" $name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $auditVolume }}
        - name: audit
          {{- toYaml .Values.audit.store.volume | nindent 10 }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
  labels:
    {{- include "holtdroid.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "holtdroid.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api-internal
  labels:
    {{- include "holtdroid.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "holtdroid.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: internal, port: 8081, targetPort: internal }
